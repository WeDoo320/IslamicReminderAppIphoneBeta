name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: |
          xcodebuild -project IslamicReminder.xcodeproj -scheme IslamicReminder \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload && cp -r build/Build/Products/Release-iphoneos/IslamicReminder.app Payload/
          zip -r IslamicReminder.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: IslamicReminder-ipa, path: IslamicReminder.ipa }
