name: IslamicReminder
options:
  bundleIdPrefix: com.islamicreminder
  deploymentTarget: { iOS: "16.0" }
packages:
  Adhan: { url: https://github.com/batoulapps/adhan-swift, from: 1.4.0 }
targets:
  IslamicReminder:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    dependencies:
      - package: Adhan
      - target: Monitor
      - target: Shield
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.islamicreminder]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Islamic Reminder
        UILaunchScreen: {}
        NSCameraUsageDescription: Zum Scannen der Gebetsmatte.
        NSLocationWhenInUseUsageDescription: Für die Gebetszeiten deiner Region.
  Monitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, App/Shared.swift]
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.islamicreminder]
    info:
      path: Monitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
  Shield:
    type: app-extension
    platform: iOS
    sources: [Shield]
    entitlements:
      path: Shield/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: Shield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
